apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-test-job
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: gpu-test
    spec:
      # Tolerate GPU node taint to schedule on GPU provisioner nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Prefer GPU nodes via node selector (matches GPU provisioner label)
      nodeSelector:
        workload-type: gpu
      containers:
      - name: cuda-vector-add
        # Use CUDA 12.0 for better driver compatibility with EKS GPU AMIs
        image: nvidia/cuda:12.0.0-base-ubuntu22.04
        command: 
          - sh
          - -c
          - |
            echo "=== GPU Test Job Started ==="
            echo "Checking NVIDIA driver and GPU..."
            if nvidia-smi; then
              echo ""
              echo "=== GPU Details ==="
              nvidia-smi --query-gpu=name,memory.total,memory.free,driver_version --format=csv
              echo ""
              echo "✅ GPU test successful! NVIDIA GPU detected and working."
            else
              echo "❌ nvidia-smi failed - GPU may not be available or drivers missing"
              echo "This can happen if:"
              echo "  1. Node doesn't have a GPU"
              echo "  2. NVIDIA drivers not installed in AMI"
              echo "  3. NVIDIA device plugin not running"
              exit 1
            fi
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "1"
            memory: "2Gi"
            nvidia.com/gpu: 1
      restartPolicy: Never
  backoffLimit: 2
  # Auto-cleanup after completion
  ttlSecondsAfterFinished: 300
